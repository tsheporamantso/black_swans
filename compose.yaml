
services:
  db:
    image: postgres:17
    container_name: student_mngmt_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: student_mngmt
      POSTGRES_PASSWORD: student_mngmt_dev_password
      POSTGRES_DB: student_mngmt_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

